name: 🚀 Build iOS App (.ipa)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 📦 Install Flutter dependencies
        run: flutter pub get

      - name: 🔑 Generate Envied environment variables
        run: |
          cp .env.example .env
          dart run build_runner build --delete-conflicting-outputs

      - name: 🍎 Setup CocoaPods & Install iOS Pods
        run: |
          cd ios
          pod install --repo-update
          cd ..

      - name: 🔨 Build iOS (Release, No Codesign)
        run: flutter build ios --release --no-codesign

      - name: 📦 Package Runner.app into .ipa
        id: package
        run: |
          APP_VER=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          echo "version=${APP_VER}" >> "$GITHUB_OUTPUT"
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r "phan_loai_rac_v${APP_VER}.ipa" Payload

      - name: 📤 Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: phan_loai_rac_ios_v${{ steps.package.outputs.version }}
          path: build/ios/iphoneos/phan_loai_rac_v${{ steps.package.outputs.version }}.ipa
