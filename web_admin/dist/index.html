<!-- web_admin/index.html -->
<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoSort Admin Portal - Đăng nhập</title>
    <script>
        if (localStorage.getItem('ecosort_theme') === 'light') {
            document.documentElement.classList.remove('dark');
        } else {
            document.documentElement.classList.add('dark');
        }
    </script>
  <script type="module" crossorigin src="/assets/main-COyC5ZJ9.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/auth-w6x5re1r.js">
  <link rel="stylesheet" crossorigin href="/assets/auth-Ddv393V6.css">
</head>

<body class="bg-slate-50 dark:bg-[#0b0f19] text-slate-900 dark:text-slate-100 min-h-screen flex flex-col justify-between p-4 sm:p-6 transition-colors duration-200">
    <!-- Top Bar: Theme Switcher & Brand Info -->
    <header class="w-full max-w-5xl mx-auto flex items-center justify-between py-2">
        <div class="flex items-center gap-2.5">
            <div class="w-8 h-8 rounded-lg bg-emerald-600 flex items-center justify-center text-white font-black text-base shadow-sm">
                E
            </div>
            <span class="font-bold text-sm text-slate-900 dark:text-white tracking-tight">EcoSort <span class="text-xs font-semibold text-emerald-600 dark:text-emerald-400">Admin</span></span>
        </div>
        <button onclick="toggleTheme()" id="theme-toggle-btn"
            class="px-3.5 py-1.5 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-lg shadow-sm hover:border-slate-300 dark:hover:border-slate-700 transition text-xs font-semibold flex items-center gap-2 text-slate-700 dark:text-slate-300">
            <!-- Dynamic icon & text -->
        </button>
    </header>

    <!-- Main Content Container -->
    <main class="w-full max-w-md mx-auto my-auto py-6">
        <div class="glass-panel p-6 sm:p-8 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-800">
            <!-- Header -->
            <div class="text-center mb-8">
                <div class="inline-flex items-center justify-center w-12 h-12 rounded-xl bg-emerald-50 dark:bg-emerald-950/40 text-emerald-600 dark:text-emerald-400 mb-3.5 border border-emerald-200/60 dark:border-emerald-800/40">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04m17.236 0a11.955 11.955 0 01-11 11.21 11.955 11.955 0 01-11-11.21M3 7l9 6 9-6">
                        </path>
                    </svg>
                </div>
                <h1 class="text-2xl font-bold text-slate-900 dark:text-white font-heading">Đăng nhập Quản trị</h1>
                <p class="text-slate-500 dark:text-slate-400 mt-1.5 text-xs sm:text-sm">Bảng điều hành & Thẩm định rác thải EcoSort</p>
            </div>

            <!-- Login Form -->
            <div id="login-form" class="space-y-4">
                <div>
                    <label for="email" class="block text-xs font-semibold text-slate-700 dark:text-slate-300 uppercase tracking-wider mb-1.5">Email quản trị</label>
                    <input type="email" id="email" placeholder="admin@ecosort.vn" autocomplete="email"
                        class="w-full px-3.5 py-2.5 bg-white dark:bg-slate-950 border border-slate-300 dark:border-slate-800 rounded-xl outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-500/20 text-slate-900 dark:text-slate-100 placeholder-slate-400 dark:placeholder-slate-600 transition text-sm">
                </div>

                <div>
                    <label for="pass" class="block text-xs font-semibold text-slate-700 dark:text-slate-300 uppercase tracking-wider mb-1.5">Mật khẩu</label>
                    <input type="password" id="pass" placeholder="••••••••" autocomplete="current-password"
                        class="w-full px-3.5 py-2.5 bg-white dark:bg-slate-950 border border-slate-300 dark:border-slate-800 rounded-xl outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-500/20 text-slate-900 dark:text-slate-100 placeholder-slate-400 dark:placeholder-slate-600 transition text-sm">
                </div>

                <div class="pt-1">
                    <button onclick="handleEmailLogin()" id="btn-login"
                        class="w-full bg-emerald-600 hover:bg-emerald-500 active:bg-emerald-700 text-white py-3 rounded-xl font-bold text-sm tracking-wide shadow-sm transition-all focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:ring-offset-2 dark:focus:ring-offset-slate-900">
                        ĐĂNG NHẬP
                    </button>
                </div>

                <div class="relative py-2">
                    <div class="absolute inset-0 flex items-center">
                        <div class="w-full border-t border-slate-200 dark:border-slate-800"></div>
                    </div>
                    <div class="relative flex justify-center text-xs">
                        <span class="bg-white dark:bg-[#111827] px-3 text-slate-400 dark:text-slate-500 font-medium">Hoặc đăng nhập không cần mật khẩu</span>
                    </div>
                </div>

                <button onclick="handleMagicLink()" id="btn-magic"
                    class="w-full border border-slate-300 dark:border-slate-800 bg-slate-50 dark:bg-slate-900/60 hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-700 dark:text-slate-300 py-2.5 rounded-xl flex items-center justify-center gap-2 font-semibold text-xs sm:text-sm transition shadow-sm">
                    <svg class="w-4 h-4 text-amber-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z">
                        </path>
                    </svg>
                    Gửi Magic Link qua Email
                </button>

                <div class="p-3 rounded-xl bg-slate-100 dark:bg-slate-900/80 border border-slate-200 dark:border-slate-800/80 text-center mt-3">
                    <p class="text-[11px] text-slate-500 dark:text-slate-400 leading-relaxed font-medium">
                        🔒 Cổng nội bộ bảo vệ bởi cơ chế Supabase Row Level Security (RLS) & RBAC 3 tầng.
                    </p>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="w-full max-w-5xl mx-auto text-center py-2 text-xs text-slate-400 dark:text-slate-500">
        © 2026 EcoSort by Bao · All rights reserved.
    </footer>

</body>

</html>
